<svg xmlns="http://www.w3.org/2000/svg" width="900" height="200" viewBox="0 0 900 200" role="img" aria-labelledby="title desc">
  <title id="title">Akilan A — Aspiring SOC Analyst</title>
  <desc id="desc">Banner introducing Akilan A, Aspiring SOC Analyst.</desc>
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D1117"/>
      <stop offset="60%" stop-color="#0F2429"/>
      <stop offset="100%" stop-color="#063B32"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00FF9C"/>
      <stop offset="50%" stop-color="#00D9FF"/>
      <stop offset="100%" stop-color="#00D68F"/>
    </linearGradient>
    <style>
      .bg { fill: url(#bgGrad); stroke: #00D68F; stroke-width: 1.5; }
      .name { fill: #FFFFFF; font: 800 48px 'Segoe UI', system-ui, -apple-system, sans-serif; letter-spacing: 3px; }
      .role { fill: #00FF9C; font: 600 18px 'Consolas', 'Fira Code', monospace; letter-spacing: 1.5px; }
      .sub { fill: #9FB3C8; font: 500 13px 'Consolas', 'Fira Code', monospace; }
      .bar { fill: url(#accentGrad); }
      @media (prefers-color-scheme: light) {
        .bg { fill: #F4FFF9; stroke: #00876C; }
        .name { fill: #0D1117; }
        .role { fill: #007E59; }
        .sub { fill: #334E68; }
      }
    </style>
  </defs>
  <rect class="bg" x="2" y="2" width="896" height="196" rx="16"/>
  <rect class="bar" x="250" y="122" width="400" height="3" rx="1.5"/>
  <text class="name" x="450" y="96" text-anchor="middle">AKILAN A</text>
  <text class="role" x="450" y="152" text-anchor="middle">ASPIRING SOC ANALYST</text>
  <text class="sub" x="450" y="176" text-anchor="middle">Alert Triage · Log Analysis · Incident Response · B.E. Cybersecurity (2023–2027)</text>
</svg>
